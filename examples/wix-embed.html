<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>

  <body>
    <!--
      Set the PDF URL in the iframe src query param.
      Encode the PDF URL with encodeURIComponent.
    -->
    <iframe
      id="pdfViewer"
      src="https://pdf-viewer-rho.vercel.app/viewer?pdf=https%3A%2F%2Fmozilla.github.io%2Fpdf.js%2Fweb%2Fcompressed.tracemonkey-pldi-09.pdf"
      title="PDF Viewer"
    ></iframe>
  </body>
</html>
