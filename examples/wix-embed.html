<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>

  <body>
    <iframe
      id="pdfViewer"
      src="https://pdf-viewer-rho.vercel.app/viewer"
      title="PDF Viewer"
    ></iframe>

    <script>
      const iframe = document.getElementById("pdfViewer");

      // Forward every message from Wix Velo → Next.js viewer iframe
      window.onmessage = function (event) {
        if (!iframe?.contentWindow) return;
        iframe.contentWindow.postMessage(event.data, "*");
      };
    </script>
  </body>
</html>
