<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wix PDF Viewer Embed</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f5f5;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      Wix HTML Component:
      1. Paste this HTML (set your Vercel URL below)
      2. Send the dynamic PDF from Velo with:
         $w("#htmlPdf").postMessage({ type: "SET_PDF", pdf: pdfUrl });
    -->
    <iframe
      id="pdf-viewer"
      src="https://pdf-viewer-rho.vercel.app/viewer"
      title="PDF Viewer"
      allow="fullscreen"
    ></iframe>

    <script>
      const iframe = document.getElementById("pdf-viewer");

      // Forward messages from Wix Velo → viewer iframe
      window.onmessage = (event) => {
        const data = event.data;
        if (!data || !iframe?.contentWindow) return;

        // Ignore our own ready echo
        if (data.type === "PDF_VIEWER_READY") {
          window.parent.postMessage(data, "*");
          return;
        }

        iframe.contentWindow.postMessage(data, "*");
      };

      // Also forward ready from viewer → Wix
      window.addEventListener("message", (event) => {
        if (event.data?.type === "PDF_VIEWER_READY" && event.data?.source === "pdf-viewer") {
          window.parent.postMessage(event.data, "*");
        }
      });
    </script>
  </body>
</html>
